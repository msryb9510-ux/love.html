<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة إلى غزل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fbf6f0;
      --primary-color: #801336;
      --accent-pink: #ee4540;
      --card-bg: #ffffff;
      --text-dark: #2d132c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Tajawal', sans-serif;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    /* Section 1: Heart Clicker */
    .hero-section {
      text-align: center;
      width: 100%;
      padding: 20px 0;
    }

    .hero-title {
      font-size: 24px;
      color: var(--primary-color);
      margin-bottom: 15px;
      font-weight: 700;
    }

    .heart-btn {
      width: 90px;
      height: 90px;
      background-color: var(--accent-pink);
      display: inline-block;
      transform: rotate(-45deg);
      margin: 30px 0 20px 0;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease;
      box-shadow: 0 10px 20px rgba(238, 69, 64, 0.3);
    }

    .heart-btn::before,
    .heart-btn::after {
      content: "";
      width: 90px;
      height: 90px;
      background-color: var(--accent-pink);
      border-radius: 50%;
      position: absolute;
    }

    .heart-btn::before {
      top: -45px;
      left: 0;
    }

    .heart-btn::after {
      top: 0;
      left: 45px;
    }

    .heart-btn:active {
      transform: rotate(-45deg) scale(1.15);
    }

    .click-hint {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }

    .love-reply {
      margin-top: 12px;
      font-size: 19px;
      color: var(--primary-color);
      font-weight: bold;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    /* Section 2: Letter Card */
    .letter-card {
      background: #fff;
      width: 100%;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      background-image: repeating-linear-gradient(#fff, #fff 31px, #e8e8e8 31px, #e8e8e8 32px);
      line-height: 32px;
      border: 1px solid #eaeaea;
    }

    .letter-date {
      font-size: 12px;
      color: #999;
      margin-bottom: 10px;
    }

    .letter-title {
      font-size: 22px;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-weight: bold;
    }

    .typing-text {
      font-size: 16px;
      color: #444;
      white-space: pre-line;
      min-height: 100px;
    }

    /* Section 3: Counter Card */
    .counter-card {
      background: var(--card-bg);
      width: 100%;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .counter-header {
      color: var(--primary-color);
      font-size: 14px;
      margin-bottom: 15px;
    }

    .main-days {
      font-size: 55px;
      font-weight: bold;
      color: var(--accent-pink);
      line-height: 1;
    }

    .days-label {
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    .time-grid {
      display: flex;
      justify-content: space-around;
      border-top: 1px dashed #eee;
      padding-top: 15px;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
    }

    .time-num {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .time-sub {
      font-size: 11px;
      color: #999;
    }

    .start-date-label {
      font-size: 11px;
      color: #aaa;
      margin-top: 15px;
    }

    /* Section 4: Reasons Cards */
    .reasons-section {
      width: 100%;
      text-align: center;
    }

    .reasons-title {
      color: var(--primary-color);
      font-size: 18px;
      margin-bottom: 15px;
    }

    .reason-card {
      background: #fff;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }

    .reason-card:active {
      transform: scale(0.98);
    }

    .reason-num {
      color: var(--accent-pink);
      font-weight: bold;
      margin-bottom: 8px;
    }

    .reason-text {
      font-size: 16px;
      color: #333;
    }

    .card-indicator {
      font-size: 11px;
      color: #bbb;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Section 1 -->
    <div class="hero-section">
      <h1 class="hero-title">بحبك... وهي مش آخر رسالة</h1>
      <div class="heart-btn" onclick="handleHeartClick()"></div>
      <div class="click-hint" id="clickHint">اضغطي على القلب</div>
      <div class="love-reply" id="loveReply">🤍 وأنا بحبك أكثر 🤍</div>
    </div>

    <!-- Section 2: Letter -->
    <div class="letter-card">
      <div class="letter-date">دمشق</div>
      <div class="letter-title">حبيبتي غزل،</div>
      <div class="typing-text" id="typewriter"></div>
    </div>

    <!-- Section 3: Counter -->
    <div class="counter-card">
      <div class="counter-header">❤️ صرنا مع بعض ❤️</div>
      <div class="main-days" id="daysNum">0</div>
      <div class="days-label">يوم</div>
      <div class="time-grid">
        <div class="time-unit">
          <span class="time-num" id="hoursNum">0</span>
          <span class="time-sub">ساعة</span>
        </div>
        <div class="time-unit">
          <span class="time-num" id="minsNum">0</span>
          <span class="time-sub">دقيقة</span>
        </div>
        <div class="time-unit">
          <span class="time-num" id="secsNum">0</span>
          <span class="time-sub">ثانية</span>
        </div>
      </div>
      <div class="start-date-label">من 3 تموز 2022</div>
    </div>

    <!-- Section 4: Interactive Reasons -->
    <div class="reasons-section">
      <div class="reasons-title">ليش بحبك؟ <br><small style="font-size: 12px; color: #777;">لأنك... وكل شيء بتحبو فيها</small></div>
      <div class="reason-card" onclick="nextReason()">
        <div class="reason-num" id="reasonIndex">1</div>
        <div class="reason-text" id="reasonContent">ضحكتك بتنسيني تعب اليوم كلو 💖</div>
        <div class="card-indicator" id="reasonCounter">1 من 6</div>
      </div>
    </div>

  </div>

  <script>
    // 1. Heart Clicker Effect
    function handleHeartClick() {
      const reply = document.getElementById('loveReply');
      const hint = document.getElementById('clickHint');
      reply.style.display = 'block';
      hint.style.display = 'none';
    }

    // 2. Typewriter Effect for Message
    const messageText = "ما بعرف من وين بلّش... بس بعرف إني من يوم ما دخلتي حياتي، صار للأيام طعم ثاني.\nبحب ضحكتك حتى لما تحاولي تخبيها، وبحب كيف بتسمعيني حتى لما ما اعرف احكي...";
    let index = 0;
    function typeEffect() {
      if (index < messageText.length) {
        document.getElementById("typewriter").textContent += messageText.charAt(index);
        index++;
        setTimeout(typeEffect, 60);
      }
    }
    window.onload = typeEffect;

    // 3. Days & Time Counter (3 July 2022 -> Year: 2022, Month: 6 [July], Day: 3)
    const startDate = new Date(2022, 6, 3);

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("daysNum").innerText = days >= 0 ? days : 0;
      document.getElementById("hoursNum").innerText = hours >= 0 ? hours : 0;
      document.getElementById("minsNum").innerText = minutes >= 0 ? minutes : 0;
      document.getElementById("secsNum").innerText = seconds >= 0 ? seconds : 0;
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    // 4. Reasons Card Flip
    const reasons = [
      "ضحكتك بتنسيني تعب اليوم كلو 💖",
      "بتفهمني من نظرة، بلا ولا كلمة 🌸",
      "إلك أحنّ قلب عرفتو ✨",
      "بتخلي كل يوم بسيط يصنع ذكرى حلوة 🤍",
      "وجودك بحياتي أمان وراحة بال 🌿",
      "لأنك غزل... وبس! 🥰"
    ];
    let currentReason = 0;

    function nextReason() {
      currentReason = (currentReason + 1) % reasons.length;
      document.getElementById("reasonIndex").innerText = currentReason + 1;
      document.getElementById("reasonContent").innerText = reasons[currentReason];
      document.getElementById("reasonCounter").innerText = `${currentReason + 1} من ${reasons.length}`;
    }
  </script>
</body>
</html>
