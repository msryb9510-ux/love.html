<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ما على قلبك شر يا حبيبتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #fff5f7;
      --bg-bottom: #fff9f2;
      --card-bg: #ffffff;
      --surface: #fff0f3;
      --surface-hover: #ffe5eb;
      --envelope-body: #ffd6e0;
      --envelope-flap: #ffc2d1;
      --border-soft: rgba(232, 121, 149, 0.22);
      --accent-rose: #e06d8b;
      --accent-warm: #f4a261;
      --seal-bg: #ff85a1;
      --text-main: #3b2630;
      --text-muted: #7c5c69;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #fef3ec 100%);
      color: var(--text-main);
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
      line-height: 1.65;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 28px;
      padding: 28px 20px 24px;
      box-shadow: 0 20px 50px rgba(224, 109, 139, 0.14);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .heart-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe3ea, #fff0d9);
      border: 1px solid rgba(224, 109, 139, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(224, 109, 139, 0.16);
      animation: floatSoft 3s ease-in-out infinite;
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.05); }
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-rose);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.93rem;
      color: var(--text-muted);
    }

    .envelopes-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 26px;
    }

    .envelope-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope-card:hover {
      background: var(--surface-hover);
      transform: translateY(-2px);
      border-color: rgba(224, 109, 139, 0.42);
    }

    .envelope-card.open {
      background: #fff8f5;
      border-color: var(--accent-rose);
      box-shadow: 0 12px 26px rgba(224, 109, 139, 0.16);
    }

    .envelope-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope-graphic {
      position: relative;
      width: 120px;
      height: 76px;
      background: linear-gradient(160deg, var(--envelope-flap), var(--envelope-body));
      border: 1px solid rgba(224, 109, 139, 0.3);
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(224, 109, 139, 0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope-graphic::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(32deg, rgba(255,255,255,0.35) 50%, transparent 50%),
        linear-gradient(-32deg, rgba(224,109,139,0.12) 50%, transparent 50%);
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: linear-gradient(180deg, #ffb3c6 0%, #ffa0b8 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
    }

    .envelope-card.open .envelope-flap {
      transform: rotateX(165deg);
      z-index: 0;
    }

    .envelope-seal {
      position: relative;
      z-index: 3;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--seal-bg);
      border: 2px solid #fff5f7;
      box-shadow: 0 4px 10px rgba(224, 109, 139, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #ffffff;
      margin-top: 12px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .envelope-card.open .envelope-seal {
      opacity: 0;
      transform: scale(0.7);
    }

    .envelope-letter {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s ease, opacity 0.35s ease, margin-top 0.35s ease;
      text-align: center;
      margin-top: 0;
    }

    .envelope-card.open .envelope-letter {
      max-height: 300px;
      opacity: 1;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed rgba(224, 109, 139, 0.35);
    }

    .letter-emoji {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 6px;
    }
